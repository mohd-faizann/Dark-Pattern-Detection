<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Pattern Detection System</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --high: #ef4444;
      --medium: #f59e0b;
      --low: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .search-box {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .search-box input {
      flex: 1;
      padding: 0.85rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-size: 1rem;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .search-box button {
      padding: 0.85rem 1.5rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .search-box button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .loading {
      text-align: center;
      color: var(--muted);
      padding: 2rem;
      display: none;
    }

    .error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      display: none;
    }

    #results { display: none; }

    .score-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }

    .score-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .confidence-value {
      font-size: 2.5rem;
      font-weight: 800;
    }

    .risk-badge {
      padding: 0.4rem 1rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
    }

    .risk-HIGH { background: rgba(239, 68, 68, 0.2); color: var(--high); }
    .risk-MEDIUM { background: rgba(245, 158, 11, 0.2); color: var(--medium); }
    .risk-LOW { background: rgba(34, 197, 94, 0.2); color: var(--low); }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
    }

    .metric {
      background: var(--bg);
      border-radius: 8px;
      padding: 0.75rem;
    }

    .metric label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }

    .metric span {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .reasons-list {
      list-style: none;
    }

    .reasons-list li {
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
      padding-left: 1.25rem;
      position: relative;
    }

    .reasons-list li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--accent);
    }

    .reasons-list li:last-child { border-bottom: none; }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.5rem;
    }

    .feature-item {
      background: var(--bg);
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      font-size: 0.9rem;
    }

    .feature-item strong {
      color: var(--accent);
    }

    .preview {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.5rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Dark Pattern Detection System</h1>
      <p>Enter a URL to analyze deceptive design patterns using BERT + rule-based confidence scoring</p>
    </header>

    <form class="search-box" id="analyze-form">
      <input
        type="url"
        id="url-input"
        placeholder="https://example.com"
        required
      />
      <button type="submit" id="submit-btn">Analyze</button>
    </form>

    <div class="loading" id="loading">Analyzing page — scraping, running BERT, extracting features...</div>
    <div class="error" id="error"></div>

    <div id="results">
      <div class="score-card">
        <div class="score-header">
          <div>
            <div class="section-title">Final Confidence</div>
            <div class="confidence-value" id="confidence">—</div>
          </div>
          <span class="risk-badge" id="risk-badge">—</span>
        </div>
        <div class="metrics">
          <div class="metric">
            <label>BERT Probability</label>
            <span id="bert-prob">—</span>
          </div>
          <div class="metric">
            <label>Rule Score</label>
            <span id="rule-score">—</span>
          </div>
          <div class="metric">
            <label>BERT Class</label>
            <span id="bert-class">—</span>
          </div>
        </div>
      </div>

      <div class="score-card">
        <div class="section-title">Explanation</div>
        <ul class="reasons-list" id="reasons"></ul>
      </div>

      <div class="score-card">
        <div class="section-title">Detected Features</div>
        <div class="features-grid" id="features"></div>
      </div>

      <div class="score-card">
        <div class="section-title">Text Preview</div>
        <p class="preview" id="text-preview"></p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("analyze-form");
    const loading = document.getElementById("loading");
    const errorEl = document.getElementById("error");
    const results = document.getElementById("results");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const url = document.getElementById("url-input").value.trim();
      if (!url) return;

      loading.style.display = "block";
      errorEl.style.display = "none";
      results.style.display = "none";
      submitBtn.disabled = true;

      try {
        const res = await fetch("/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || "Analysis failed");
        }

        document.getElementById("confidence").textContent = data.confidence + "%";
        document.getElementById("bert-prob").textContent =
          (data.bert_probability * 100).toFixed(1) + "%";
        document.getElementById("rule-score").textContent = data.rule_score + "%";
        document.getElementById("bert-class").textContent = data.bert_class;

        const badge = document.getElementById("risk-badge");
        badge.textContent = data.risk_level + " RISK";
        badge.className = "risk-badge risk-" + data.risk_level;

        const reasonsEl = document.getElementById("reasons");
        reasonsEl.innerHTML = data.reasons
          .map((r) => `<li>${r}</li>`)
          .join("");

        const featuresEl = document.getElementById("features");
        featuresEl.innerHTML = Object.entries(data.features)
          .map(
            ([key, val]) =>
              `<div class="feature-item">${key.replace(/_/g, " ")}: <strong>${val}</strong></div>`
          )
          .join("");

        document.getElementById("text-preview").textContent =
          data.text_preview || "No text extracted.";

        results.style.display = "block";
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = "block";
      } finally {
        loading.style.display = "none";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
